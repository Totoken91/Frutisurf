<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#15CEE8" />
<!-- Applique AVANT que la feuille de style ne soit lue : sans ca, le tout
     premier rendu d'un lecteur en mode sombre part sur une toile de fond noire. -->
<meta name="color-scheme" content="light" />
<title>Frutiger Surfer</title>
<meta name="description" content="Un bonhomme MSN en verre surfe sur un CD a travers des plaines Frutiger Aero. Carve, saute, plane, traverse les lacs a pleine vitesse." />

<!-- Partage. Sans ces balises, un lien colle dans une conversation n'affiche
     qu'une URL nue, ce qui est exactement le contraire de ce qu'on veut pour
     un jeu qui se vend a l'oeil. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Frutiger Surfer" />
<meta property="og:description" content="Un bonhomme MSN en verre surfe sur un CD a travers des plaines Frutiger Aero." />
<meta property="og:image" content="/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Frutiger Surfer" />
<meta name="twitter:description" content="Un bonhomme MSN en verre surfe sur un CD a travers des plaines Frutiger Aero." />
<meta name="twitter:image" content="/og.png" />

<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Plein ecran quand le jeu est ajoute a l'ecran d'accueil : la barre
     d'adresse mobile est la premiere source de redimensionnements en rafale. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Frutiger Surfer" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <!-- L'ecran d'equipement vit HORS du HUD : le HUD est en pointer-events:none
       et se fait masquer d'un bloc pendant le choix, or cet ecran doit rester
       cliquable exactement quand le HUD ne l'est plus. -->
  <div id="pick"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
